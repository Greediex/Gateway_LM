name: Composite Adapter / Graph Regression

on:
  push:
    branches:
      - refactor/gateway-lm-composite-adapter-pr01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-react.txt

      - name: Fetch pinned GoS and SkillDAG kernels
        run: python setup_upstream.py

      - name: Composite adapter unit tests
        run: python -m unittest tests_graph_v3.test_composite_adapter -v

      - name: Graph regression suite
        run: python -m unittest discover -s tests_graph_v3 -v

      - name: Legacy regression suite
        run: python -m unittest discover -s tests -v
