name: Composite Adapter / Graph Regression

on:
  push:
    branches:
      - refactor/gateway-lm-composite-adapter-pr01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-react.txt

      - name: Fetch and verify pinned GoS and SkillDAG kernels
        run: |
          if ! python setup_upstream.py; then
            echo "Pinned source hashes at checked-out commits:"
            sha256sum third_party/graph-of-skills/gos/core/retrieval.py || true
            sha256sum third_party/SkillDAG/src/skilldag/search.py || true
            sha256sum third_party/SkillDAG/src/skilldag/graph.py || true
            exit 1
          fi

      - name: Composite adapter unit tests
        run: python -m unittest tests_graph_v3.test_composite_adapter -v

      - name: Graph regression suite
        run: python -m unittest discover -s tests_graph_v3 -v

      - name: Legacy regression suite
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end assistant replay on cloud runner
        run: |
          mkdir -p runs/cloud_smoke
          python -m gateway_pilot.assistant --fixture GLM-04-0 --request "Check WAN" --trace > runs/cloud_smoke/wan.json
          python -m gateway_pilot.assistant --fixture GLM-21-1 --request "Laptop An có wifi nhưng không vào internet" --trace > runs/cloud_smoke/client.json
          python -c 'import json; from pathlib import Path; rows=[(p.name,json.loads(p.read_text(encoding="utf-8"))) for p in sorted(Path("runs/cloud_smoke").glob("*.json"))]; print("\n".join("{}: {} | {}".format(name, row.get("case_status"), row.get("answer","")[:180]) for name,row in rows)); assert len(rows)==2; assert all(row.get("answer") for _,row in rows)'

      - name: Upload demo results
        uses: actions/upload-artifact@v4
        with:
          name: gateway-lm-cloud-smoke
          path: runs/cloud_smoke/*.json
